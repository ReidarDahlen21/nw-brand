<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="font-family:var(--font-body);background:var(--color-hueso);padding:24px"></div>
<script type="text/babel">
const {Input,Select,Checkbox,Radio,Switch}=window.NucleoWealthDesignSystem_3466ee;
function Demo(){
const [c,setC]=React.useState(true);
const [r,setR]=React.useState('m');
const [s,setS]=React.useState(true);
return (
<div style={{display:'flex',gap:24,flexWrap:'wrap'}}>
<Input label="Nombre completo" placeholder="Ej. María Fernández" style={{width:200}}/>
<Input label="Monto" error="Ingresá un valor válido" value="" style={{width:160}}/>
<Select label="Perfil de riesgo" options={['Conservador','Moderado','Agresivo']} style={{width:180}}/>
<div style={{display:'flex',flexDirection:'column',gap:14,justifyContent:'center'}}>
<Checkbox label="Acepto los términos" checked={c} onChange={e=>setC(e.target.checked)}/>
<Radio label="Mensual" checked={r==='m'} onChange={()=>setR('m')}/>
<div style={{display:'flex',alignItems:'center',gap:10}}><Switch checked={s} onChange={e=>setS(e.target.checked)}/><span>Notificaciones</span></div>
</div>
</div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
