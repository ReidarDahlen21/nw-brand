<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root"></div>
<script type="text/babel" src="./Shell.jsx"></script>
<script type="text/babel" src="./Login.jsx"></script>
<script type="text/babel" src="./Dashboard.jsx"></script>
<script type="text/babel" src="./PortfolioDetail.jsx"></script>
<script type="text/babel" src="./AdvisorChat.jsx"></script>
<script type="text/babel">
function App(){
const [loggedIn,setLoggedIn]=React.useState(false);
const [nav,setNav]=React.useState('dashboard');
const [tab,setTab]=React.useState('General');
if(!loggedIn)return <Login onLogin={()=>setLoggedIn(true)}/>;
return (
<Shell active={nav} onNav={setNav}>
{nav==='dashboard'&&<Dashboard tab={tab} onTab={setTab}/>}
{nav==='portfolio'&&<PortfolioDetail/>}
{nav==='chat'&&<AdvisorChat/>}
</Shell>
);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
